name: manifest

# Rebuilds photos.json whenever a photo lands in photos/.
# This is what makes phone uploads hands-off: the Shortcut PUTs the image,
# this Action regenerates the manifest, the TV picks it up on next launch.

on:
  push:
    branches: [main]
    paths:
      - 'photos/**'
      - 'scripts/make-manifest.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild manifest
        env:
          REPO_SLUG: ${{ github.repository }}
          REPO_BRANCH: ${{ github.ref_name }}
        run: node scripts/make-manifest.mjs

      - name: Commit if changed
        run: |
          git config user.name "photos-bot"
          git config user.email "photos-bot@users.noreply.github.com"
          git add photos.json
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "photos: rebuild manifest"
          # Uploading several photos at once fires several runs; whichever
          # pushes second is rejected as non-fast-forward. Rebase and retry.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep 5
          done
          echo "could not push after 3 attempts" >&2
          exit 1
