name: manifest

# Rebuilds photos.json whenever a photo lands in photos/.
# This is what makes phone uploads hands-off: the Shortcut PUTs the image,
# this Action regenerates the manifest, the TV picks it up on next launch.

on:
  push:
    branches: [main]
    paths:
      - 'photos/**'
      - 'scripts/make-manifest.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild manifest
        env:
          REPO_SLUG: ${{ github.repository }}
          REPO_BRANCH: ${{ github.ref_name }}
        run: node scripts/make-manifest.mjs

      - name: Commit if changed
        env:
          REPO_SLUG: ${{ github.repository }}
          REPO_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "photos-bot"
          git config user.email "photos-bot@users.noreply.github.com"

          # Bulk uploads fire several of these runs at once, so two jobs can
          # both regenerate photos.json and one loses the push. Rebasing that
          # commit produces a real conflict, so instead: sync to the latest
          # remote state, regenerate from *those* files, then push. Each
          # attempt starts clean, which makes a conflict impossible.
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch --quiet origin main
            git reset --hard --quiet origin/main

            node scripts/make-manifest.mjs

            if git diff --quiet -- photos.json; then
              echo "no change"
              exit 0
            fi

            git add photos.json
            git commit -m "photos: rebuild manifest" --quiet
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, retrying ($attempt)"
            sleep 5
          done
          echo "could not push after 5 attempts" >&2
          exit 1
